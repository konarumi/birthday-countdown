<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Narumi's Birthday Countdown</title>

  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&display=swap" rel="stylesheet">
</head>

<body>

  <main class="container">

    <img
      src="images/top-bg.png"
      alt="Birthday Countdown"
      class="background"
    >

    <div class="title-area">
      <div class="star">✦</div>

      <h1>
        Narumi's<br>
        Birthday Countdown
      </h1>
    </div>

    <button class="hotspot birthday">
      <span class="sparkle sparkle1">✦</span>
      <span class="sparkle sparkle2">✦</span>
      <span class="sparkle sparkle3">✦</span>
    </button>

    <button class="hotspot day1">
      <span class="sparkle sparkle1">✦</span>
      <span class="sparkle sparkle2">✦</span>
      <span class="sparkle sparkle3">✦</span>
    </button>

    <button class="hotspot day2">
      <span class="sparkle sparkle1">✦</span>
      <span class="sparkle sparkle2">✦</span>
      <span class="sparkle sparkle3">✦</span>
    </button>

    <button class="hotspot day3">
      <span class="sparkle sparkle1">✦</span>
      <span class="sparkle sparkle2">✦</span>
      <span class="sparkle sparkle3">✦</span>
    </button>

    <button class="hotspot day4">
      <span class="sparkle sparkle1">✦</span>
      <span class="sparkle sparkle2">✦</span>
      <span class="sparkle sparkle3">✦</span>
    </button>

  <!-- モーダル -->

  <div id="modal" class="modal">

    <div class="modal-content">

      <button id="closeModal" class="close-btn">
        ✕
      </button>

      <div id="modalBody"></div>

    </div>

  </div>

  </main>

  <script src="script.js"></script>

</body>
</html>
